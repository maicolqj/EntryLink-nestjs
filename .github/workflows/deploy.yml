name: Deploy to Production

on:
  workflow_run:
    workflows: ["Build & Push Docker Image"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify Deploy
        run: |
          # Coolify 4.6 solo acepta POST en /api/v1/deploy (GET responde 405).
          # El cuerpo va vacío y explícito: algunos proxies exigen Content-Length en un POST.
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "${{ secrets.COOLIFY_URL }}/api/v1/deploy?uuid=${{ secrets.COOLIFY_APP_UUID }}&force=false" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            -H "Content-Length: 0")

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Deploy triggered successfully (HTTP $HTTP_STATUS)"
          else
            echo "Deploy trigger failed (HTTP $HTTP_STATUS)"
            if [ "$HTTP_STATUS" = "401" ] || [ "$HTTP_STATUS" = "403" ]; then
              echo "::error::Coolify rechazó el token: revisar en Keys & Tokens que tenga permiso de deploy."
            elif [ "$HTTP_STATUS" = "405" ]; then
              echo "::error::Coolify cambió el método del endpoint de deploy: revisar su API."
            fi
            exit 1
          fi

      - name: Verificar que el contenedor quedó sano
        env:
          HEALTH_URL: ${{ secrets.PRODUCTION_HEALTH_URL || 'https://api.alternaqj.com/health' }}
        run: |
          # Coolify levanta el contenedor nuevo y recién después retira el viejo.
          # Se espera antes de la primera sonda para no leer al que ya se va.
          echo "Dando 45s a Coolify para reemplazar el contenedor…"
          sleep 45

          echo "Sondeando $HEALTH_URL hasta que responda 200…"
          for attempt in $(seq 1 40); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$HEALTH_URL" || echo "000")

            if [ "$STATUS" = "200" ]; then
              echo "Producción responde 200 tras $attempt sondeo(s)."
              exit 0
            fi

            echo "Sondeo $attempt/40: HTTP $STATUS — se reintenta en 15s."
            sleep 15
          done

          echo "::error::Producción no respondió 200 en 10 minutos tras el despliegue."
          echo "El contenedor no logró arrancar o no pasa su health check."
          echo "Revisar los logs de la aplicación en Coolify: un fallo al importar"
          echo "módulos o una migración caída dejan a Traefik sin instancia sana,"
          echo "y entonces toda la API responde 503."
          exit 1
